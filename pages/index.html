<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script>
    // Sets the day/night theme before first paint, so there's no flash of
    // the wrong one. Stored choice wins; first-ever visit falls back to
    // the OS/browser's prefers-color-scheme. Mirrors app.js's THEME_KEY —
    // see docs/theme.md.
    (function () {
      var KEY = "rh-theme", t;
      try { t = localStorage.getItem(KEY); } catch (err) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <title>Radio Hectolitre</title>
  <!-- GitHub Pages always serves the repo root as "/", so the real homepage
       lives at /index.html. This file exists only so /pages/index.html
       (matching the pattern of /pages/about.html, /pages/archive.html)
       resolves somewhere sensible instead of 404ing. -->
  <meta http-equiv="refresh" content="0; url=../index.html" />
  <link rel="canonical" href="../index.html" />
  <link rel="stylesheet" href="../assets/css/styles.css" />
  <link rel="icon" href="../assets/img/favicon/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/img/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/img/favicon/icon-192.png">
  <link rel="apple-touch-icon" href="../assets/img/favicon/apple-touch-icon.png">
</head>
<body>
  <div class="redirect-shell">
    <p>Redirecting to Radio Hectolitre…</p>
    <a href="../index.html">Continue to the homepage →</a>
  </div>
</body>
</html>
