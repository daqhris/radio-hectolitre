<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script>
    // Sets the day/night theme before first paint, so there's no flash of
    // the wrong one. Stored choice wins; first-ever visit falls back to
    // the OS/browser's prefers-color-scheme. Mirrors app.js's THEME_KEY —
    // see docs/theme.md.
    (function () {
      var KEY = "rh-theme", t;
      try { t = localStorage.getItem(KEY); } catch (err) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <title>Guest works — Radio Hectolitre</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body>

  <div id="site-nav-mount"></div>

  <header class="page-hero">
    <div class="page-hero-eyebrow">Guest works</div>
    <h1 class="page-hero-title">Works from beyond Hectolitre</h1>
    <p class="page-hero-sub">Sound and performance pieces made by artists at Hectolitre — from a Venice Biennale commission to releases straight off the label.</p>
  </header>

  <main class="page">
    <div id="works-grid"></div>
  </main>

  <div id="site-footer-mount"></div>

  <script>
    window.SITE_BASE = "../";
  </script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/station.js"></script>
  <script src="../assets/js/render-archive.js"></script>
  <script>
    (async function () {
      await RadioHecto.initChrome("pages/works.html");
      renderWorksGrid({ mountId: "works-grid", emptyText: "No guest works published yet." });
    })();
  </script>
</body>
</html>
