name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Your repo is already a static site:
          # - /index.html is the homepage
          # - /pages/* and /assets/* are served as-is
          path: ./
          # (Optional but often helpful to avoid uploading workflow noise)
          # if supported in your action version, otherwise ignore:
          # exclude: .github/**

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
